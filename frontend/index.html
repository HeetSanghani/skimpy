<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon & Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="msapplication-TileColor" content="#6366f1" />

    <!-- Primary SEO (overridden per-page by useSEO hook) -->
    <title>Skimpy Marketplace — Thrifted & Handcrafted Finds</title>
    <meta name="description" content="Discover unique thrifted finds, handcrafted treasures, antiques, books, and more on Skimpy — India's curated online marketplace." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Skimpy Marketplace" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skimpy Marketplace" />
    <meta property="og:title" content="Skimpy Marketplace — Thrifted & Handcrafted Finds" />
    <meta property="og:description" content="Discover unique thrifted finds, handcrafted treasures, antiques, books, and more on Skimpy." />
    <meta property="og:url" content="https://skimpy.vercel.app" />
    <meta property="og:image" content="https://skimpy.vercel.app/og-default.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skimpy Marketplace" />
    <meta name="twitter:description" content="Discover unique thrifted finds, handcrafted treasures, antiques, books, and more on Skimpy." />
    <meta name="twitter:image" content="https://skimpy.vercel.app/og-default.png" />

    <!-- Google Fonts preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
